name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore sortflow-api/SortFlow.sln
        working-directory: .
      - run: dotnet build sortflow-api/SortFlow.sln -c Release --no-restore
      - run: dotnet test sortflow-api/SortFlow.sln -c Release --no-build --verbosity normal
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sortflow-web/package-lock.json
      - run: npm ci
        working-directory: sortflow-web
      - run: npm run build
        working-directory: sortflow-web
