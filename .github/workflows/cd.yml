# CD to Azure App Service. Configure secrets: AZURE_WEBAPP_PUBLISH_PROFILE (or use AZURE_CREDENTIALS), AZURE_WEBAPP_NAME
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish sortflow-api/src/SortFlow.Api/SortFlow.Api.csproj -c Release -o ./publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
        continue-on-error: true

  # Alternative: deploy using Publish Profile only (no service principal)
  # - run: dotnet publish ... -o ./publish
  # - uses: azure/webapps-deploy@v3
  #   with:
  #     app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
  #     publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
  #     package: ./publish
